<!DOCTYPE html>
<html>
<head>
<meta charset='utf-8'>
<meta http-equiv='X-UA-Compatible' content='IE=edge'>
<title>Page Title</title>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<link rel='stylesheet' type='text/css' media='screen' href='css/style.css'>
<!-- used tailwind CDN here -->
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script src='main.js'></script>
</head>
<body class="bg-gray-400">
<!-- navigation -->
<nav class="bg-blue-400 p-4 sticky top-0 z-50 w-full flex flex-wrap">      
  <div class="flex  items-center justify-between">
    <!-- Logo -->
    <a href="#" class="text-2xl font-bold text-white uppercase">
      Grocery App
    </a>
    <!-- Hamburger Button -->
    <button onclick="toggleMenu()" class="text-white text-3xl md:hidden ml-54">
      ☰
    </button>
  </div>

  <!-- Navigation Menu -->
  <div class="ml-64"> 
  <ul id="mobileMenu"
      class="fixed top-0 left-0  h-full w-64 bg-blue-500 text-white
             transform -translate-x-full transition-transform duration-300
             flex flex-col gap-6 p-6 text-lg font-mono
             md:static md:translate-x-0 md:flex-row md:h-auto md:w-auto
             md:bg-transparent md:p-0 md:gap-8 md:items-center">

    <!-- Close button (mobile only) -->
    <li class="md:hidden">
      <button onclick="toggleMenu()" class="text-2xl">✕</button>
    </li>

    <li><a href="#">Home</a></li>
    <li><a href="#">Blogs</a></li>
    <li><a href="#">Download</a></li>
    <li><a href="#">Products</a></li>
    <li><a href="#">Gallery</a></li>

    <!-- Dropdown -->
    <li class="relative group">
      <a href="#" class="block">My Account 👥</a>

      <!-- Desktop dropdown -->
      <ul class="hidden md:block md:absolute md:top-full md:left-0
                 md:bg-blue-400 md:p-3 md:rounded md:shadow-lg
                 md:opacity-0 md:invisible
                 md:group-hover:opacity-100 md:group-hover:visible
                 transition-all duration-300">

        <li><a href="#" class="block py-1">SignUp</a></li>
        <li><a href="#" class="block py-1">SignIn</a></li>
      </ul>
    </li>

    <li><a href="#">Contact</a></li>
  </ul>
 </div> 
</nav>


<div class="sm:w-full md-w-full lg:w-1/3 p-15 mt-20 bg-white mx-auto rounded-4xl">
<h2 class="sm:text-xl md:text-2xl lg:text-3xl font-extrabold uppercase animate-bounce"> register here</h2>
<div class="flex flex-col gap-y-2 mt-2">
<label for="id" class="text-sm font-medium">Name *</label>
<input type="text" placeholder="Name *" class="form-control p-2 bg-gray-400 rounded-xl" />
</div>

<div class="flex flex-col gap-y-2 mt-2">
<label for="id" class="text-sm font-medium">Password *</label>
<input type="password" placeholder="Password *" class="form-control p-2 bg-gray-400 rounded-xl" />
</div>


<div class="flex flex-col gap-y-2 mt-2">
<label for="id" class="text-sm font-medium">Phone *</label>
<input type="text" placeholder="Phone *" class="form-control p-2 bg-gray-400 rounded-xl" />
</div>

<div class="flex flex-col gap-y-2 mt-2">
<label for="id" class="text-sm font-medium">Address *</label>
<input type="text" placeholder="Address *" class="form-control p-2 bg-gray-400 rounded-xl" />
</div>

<div class="flex flex-col gap-y-2 mt-2">
<button class="bg-blue-500 sm:ml-0 md:ml-40  lg:ml-40 mt-10 rounded-4xl p-3 transition delay-150 duration-300 ease-in-out hover:-translate-y-1 hover:scale-110 hover:bg-indigo-500">
Save Changes 👤
</button>
</div>
<div class="flex flex-col gap-y-2 mt-2">
<b>Already have an account <button type="button" command="show-modal" commandfor="dialog">Login here</button></b>
</div>
</div>

<!-- load a modal  -->

<el-dialog>
<dialog id="dialog" aria-labelledby="dialog-title" class="fixed inset-0 size-auto max-h-none max-w-none overflow-y-auto bg-transparent backdrop:bg-transparent">
<el-dialog-backdrop class="fixed inset-0 bg-gray-950/100 transition-opacity data-closed:opacity-0 data-enter:duration-300 data-enter:ease-out data-leave:duration-200 data-leave:ease-in"></el-dialog-backdrop>

<div tabindex="0" class="flex min-h-full items-end justify-center p-4 text-center focus:outline-none sm:items-center sm:p-0 sm:-mt-48 md:-mt-36 lg:-mt-24">

<el-dialog-panel class="relative transform overflow-hidden rounded-lg bg-gray-800 text-left shadow-xl outline -outline-offset-1 outline-white/10 transition-all data-closed:translate-y-4 data-closed:opacity-0 data-enter:duration-300 data-enter:ease-out data-leave:duration-200 data-leave:ease-in sm:my-8 sm:w-full sm:max-w-lg data-closed:sm:translate-y-0 data-closed:sm:scale-95">
<div class="px-4 pt-0 pb-2 sm:p-6 sm:pb-4  bg-white">
<div class="sm:flex sm:items-start">
<div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left">

<h2 class="sm:text-xl md:text-2xl lg:text-3xl font-extrabold uppercase animate-bounce"> Login here</h2>
<div class="flex flex-col gap-y-2 mt-2">
<label for="id" class="text-sm font-medium">Email *</label>
<input type="text" placeholder="Name *" class="form-control p-2 bg-gray-400 rounded-xl" />
</div>

<div class="flex flex-col gap-y-2 mt-2">
<label for="id" class="text-sm font-medium">Password *</label>
<input type="password" placeholder="Password *" class="form-control p-2 bg-gray-400 rounded-xl" />
</div>



<div class="flex flex-col gap-y-2 mt-2">
<button class="bg-blue-500 sm:ml-0 md:ml-40  lg:ml-40 mt-10 rounded-4xl p-3 transition delay-150 duration-300 ease-in-out hover:-translate-y-1 hover:scale-110 hover:bg-indigo-500">
Save Changes 👤
</button>
</div>
<div class="flex flex-col gap-y-2 mt-2">
<b>Don't have an account <button type="button" command="show-modal" commandfor="dialog">Create Account</button></b>
</div>


</div>
</div>
</div>
</div>

</el-dialog-panel>
</div>
</dialog>
</el-dialog>


<script src="https://cdn.jsdelivr.net/npm/@tailwindplus/elements@1" type="module"></script>
<script>
function toggleMenu() {
document.getElementById("mobileMenu")
.classList.toggle("-translate-x-full");
}
</script>
</body>
</html>
