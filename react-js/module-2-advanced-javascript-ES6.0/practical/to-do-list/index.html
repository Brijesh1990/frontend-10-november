<!DOCTYPE html>
<html>
<head>
<meta charset='utf-8'>
<meta http-equiv='X-UA-Compatible' content='IE=edge'>
<title>To Do List</title>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

<div class="bg-white shadow-xl rounded-2xl p-6 w-full max-w-xl">

    <h1 class="text-2xl md:text-3xl font-bold text-center mb-6">
        To Do List App
    </h1>

    <!-- Input Section -->
    <div class="flex flex-col md:flex-row gap-3">

        <input 
            type="text" 
            id="taskInput"
            placeholder="Add Task....."
            class="w-full border p-3 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500"
        />

        <input 
            type="text" 
            id="srNumber"
            placeholder="Enter serial numbers....."
            class="w-full border p-3 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500"
        />

        <button 
            type="button" 
            onclick="addTask()"
            class="w-full md:w-auto bg-blue-700 hover:bg-blue-800 text-white px-6 py-3 rounded-2xl transition duration-300"
        >
            Add Task
        </button>

    </div>

    <!-- Task List -->
    <ul id="taskList" class="mt-6 space-y-3">
    </ul>

</div>

<script src='js/main.js'></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</body>
</html>
