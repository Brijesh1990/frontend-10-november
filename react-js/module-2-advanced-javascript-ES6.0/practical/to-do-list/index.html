<!DOCTYPE html>
<html>
<head>
<meta charset='utf-8'>
<meta http-equiv='X-UA-Compatible' content='IE=edge'>
<title>To Do List</title>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<link rel="stylesheet" href="css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
<div class="bg-white shadow-xl rounded-2xl p-6 w-150">
<h1 class="text-2xl font-bold text-center mb-5">To do List App</h1>
<div class="flex gap-2">
<input type="text" id="taskInput" class="flex-1 w-80 border p-3 rounded-2xl" placeholder="Add Task....." />
<input type="text" id="srNumber" class="flex-1 w-80 border p-3 rounded-2xl" placeholder="Enter serial numbers....." />
<button type="button" onclick="addTask()" class="bg-blue-700 text-white p-3 rounded-2xl">Add Task</button>
</div>
<!-- display task -->
<ul id="taskList" class="mt-5 space-y-2">    

</ul>
</div>
<!-- js called -->
 <script src='js/main.js'></script>
 <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
