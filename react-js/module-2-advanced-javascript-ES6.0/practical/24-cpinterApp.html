<!DOCTYPE html>
<html>
<head>
<meta charset='utf-8'>
<meta http-equiv='X-UA-Compatible' content='IE=edge'>
<title>Page Title</title>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<link rel='stylesheet' type='text/css' media='screen' href='main.css'>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
<script src='main.js'></script>
</head>
<body>
<!-- counter app -->
<div class="container w-25 mx-auto mt-5 p-5 shadow">
<h1 id="count">0</h1>    
<button type="button" id="increase" class="btn btn-success ms-0">+</button>
<button type="button" id="decrease" class="btn btn-success ms-2">-</button>
<button type="button" id="reset" class="btn btn-success ms-2">Reset</button>
</div> 
<script>
let count=0;
const countResult=document.getElementById("count");
const increaseBtn=document.getElementById("increase");
const decreaseBtn=document.getElementById("decrease");
const resetBtn=document.getElementById("reset");

increaseBtn.addEventListener("click",()=>{
count++;
countResult.textContent=count;
})
decreaseBtn.addEventListener("click",()=>{
count--;
countResult.textContent=count;
})
resetBtn.addEventListener("click",()=>{
count=0;
countResult.textContent=count;
})

</script>    
</body>
</html>
