let btn=document.getElementById("btn");
btn.addEventListener("click",maxResult);
//create a function 
function maxResult()
{
let n1=parseInt(document.getElementById("n1").value);
let n2=parseInt(document.getElementById("n2").value);
let n3=parseInt(document.getElementById("n3").value);
    
if(n1>n2 && n1>n3)
{
document.getElementById("demo").innerHTML="N1 is max Numbers";
}
else if(n2>n1 && n2>n3)
{
document.getElementById("demo").innerHTML="N2 is max Numbers";   
}

else if(n3>n2 && n3>n1)
{
document.getElementById("demo").innerHTML="N3 is max Numbers";

}
else 
{

document.getElementById("demo").innerHTML="something went wrong while check condition";
}
}
