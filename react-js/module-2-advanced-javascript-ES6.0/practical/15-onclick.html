<!DOCTYPE html>
<html>
<head>
<meta charset='utf-8'>
<meta http-equiv='X-UA-Compatible' content='IE=edge'>
<title>Page Title</title>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<link rel='stylesheet' type='text/css' media='screen' href='main.css'>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
<script>
function add()
{
var a=parseInt(prompt('Enter a values :'));
var b=parseInt(prompt('Enter b values :'));
var c=a+b;
alert('Additions of numbers is :'+c)    
}
function subs()
{
var a=parseInt(prompt('Enter a values :'));
var b=parseInt(prompt('Enter b values :'));
var c=a-b;
alert('Substractions of numbers is :'+c)    
}
function mult()
{
var a=parseInt(prompt('Enter a values :'));
var b=parseInt(prompt('Enter b values :'));
var c=a*b;
alert('Multiplications of numbers is :'+c)    
}
function dv()
{
var a=parseInt(prompt('Enter a values :'));
var b=parseInt(prompt('Enter b values :'));
var c=a/b;
alert('Divisions of numbers is :'+c)    
}
</script>
</head>
<body>
<div class="container w-75 mx-auto shadow mt-5 p-5">
<button type="button" onclick="add()" class="btn btn-md btn-danger text-white">Additions</button>
<button type="button" onclick="subs()" class="btn btn-md btn-danger text-white">Substraction</button>
<button type="button" onclick="mult()" class="btn btn-md btn-danger text-white">Multiplication</button>
<button type="button" onclick="dv()" class="btn btn-md btn-danger text-white">Divisions</button>
</div>
</body>
</html>
