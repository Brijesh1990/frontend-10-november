<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shopping Cart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container my-5">
  <div class="card shadow">
    <div class="card-header bg-primary text-white">
      <h4 class="mb-0">Shopping Cart</h4>
    </div>

    <div class="card-body">
      <table class="table table-bordered align-middle text-center w-75">
        <thead class="table-dark">
          <tr>
            <th>Product</th>
            <th>Price ($)</th>
            <th>Quantity</th>
           
          </tr>
        </thead>
        <tbody id="cart-body">
          <tr>
            <td>Product 1</td>
            <td class="price"><input type="text" id="price" class="w-25" value="50" readonly style="border:none"></td>
            <td>
              <input type="number" class="form-control quantity" onchange="res()" value="1" id="qty" min="1" max="10">
            </td>
           
          </tr>
        
       
        </tbody>
      </table>

      <div class="d-flex justify-content-end w-75">
        <h5>Subtotal: $<span id="subtotal"><label id="total">50</label></span></h5>
      </div>
    </div>
  </div>
</div>
<script>
 function res()
 {
    var price=document.getElementById("price").value;
    var qty=document.getElementById("qty").value;
    var result=price*qty;
    document.getElementById("total").innerHTML=+result;
 }
</script>

</body>
</html>
