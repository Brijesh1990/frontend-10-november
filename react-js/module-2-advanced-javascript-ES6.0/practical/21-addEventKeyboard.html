<!DOCTYPE html>
<html>
<head>
<meta charset='utf-8'>

<body>
<p id="demo">This is sweta</p>
<button type="button" id="btn">Click Me</button>
<script>
//addEventListener is used as event 
//addEventListener is used in advanced javascript using ES6 or ES7
//addEventListener is called a callback function
var btn=document.getElementById("btn");
btn.addEventListener("keydown",function display(){
 document.getElementById("demo").style='color:blue; font-size:40px;transition:2s ease all'
});
</script>    
</body>
