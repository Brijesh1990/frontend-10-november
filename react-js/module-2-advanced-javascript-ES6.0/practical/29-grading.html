<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grading System Form</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
<div class="min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-md bg-white rounded-lg shadow-md p-6">
<h1 class="text-2xl font-bold text-gray-800 mb-6">Grading System</h1>

<form id="gradingForm" class="space-y-4">
<div>
<label class="block text-sm font-medium text-gray-700 mb-2">Student Name</label>
<input type="text" id="studentName" placeholder="Enter name" required 
class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
</div>

<div>
<label class="block text-sm font-medium text-gray-700 mb-2">Score (0-100)</label>
<input type="number" id="score" min="0" max="100" placeholder="Enter score" required 
class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
</div>

<button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition">
Calculate Grade
</button>
</form>

<div id="result" class="mt-6 hidden p-4 bg-blue-50 border border-blue-200 rounded-lg">
<p class="text-sm text-gray-700"><span class="font-semibold">Student:</span> <span id="resultName"></span></p>
<p class="text-sm text-gray-700 mt-2"><span class="font-semibold">Score:</span> <span id="resultScore"></span></p>
<p class="text-2xl font-bold text-blue-600 mt-3">Grade: <span id="resultGrade"></span></p>
</div>
</div>
</div>

<script>
function calculateGrade(score) {
if (score >= 90) return 'A';
if (score >= 80) return 'B';
if (score >= 70) return 'C';
if (score >= 60) return 'D';
return 'F';
}

document.getElementById('gradingForm').addEventListener('submit', function(e) {
e.preventDefault();

const name = document.getElementById('studentName').value;
const score = parseInt(document.getElementById('score').value);
const grade = calculateGrade(score);

document.getElementById('resultName').textContent = name;
document.getElementById('resultScore').textContent = score;
document.getElementById('resultGrade').textContent = grade;
document.getElementById('result').classList.remove('hidden');
});
</script>
</body>
</html>
