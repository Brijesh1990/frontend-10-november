<!DOCTYPE html>
<html>
<head>
<meta charset='utf-8'>
<meta http-equiv='X-UA-Compatible' content='IE=edge'>
<title>Page Title</title>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<link rel='stylesheet' type='text/css' media='screen' href='main.css'>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

<script src='main.js'></script>
</head>
<body>
<script>
function result()
{
  var number=document.getElementById("num").value;  
  var sq=Math.pow(number,2);
  document.getElementById("res").innerHTML="The square of numbers is :"+sq;
}
</script>    
<div class="container w-25 p-5 mt-5 mx-auto shadow">
<p id="res"></p>    
<h1>Square</h1>
<form>
<input type="number" id="num" placeholder="Enter number" required class="form-control">
<br>
<button type="button" onclick="result()" class="btn btn-md btn-danger text-white">Get square of numbers</button>
</form>
</div>
</body>
</html>
